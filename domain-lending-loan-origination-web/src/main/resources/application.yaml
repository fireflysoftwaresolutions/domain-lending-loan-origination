spring:
  application:
    name: domain-lending-loan-origination
    version: 1.0.0
    description: Lending Domain Loan Origination Layer Application
    team:
      name: Firefly Software Foundation
      email: dev@fireflysoftware.io

  codec:
    max-in-memory-size: 20MB

  threads:
    virtual:
      enabled: true

firefly:
  cache:
    default-cache-type: POSTGRES
    postgres:
      enabled: true
      host: ${CACHE_DB_HOST:localhost}
      port: ${CACHE_DB_PORT:5432}
      database: ${CACHE_DB_NAME:}
      username: ${CACHE_DB_USERNAME:}
      password: ${CACHE_DB_PASSWORD:}
      ssl-mode: ${CACHE_DB_SSL_MODE:verify-full}
      schema: ${CACHE_DB_SCHEMA:firefly_lending_domain_cache}
      cache-table: cache_entries
      auto-create-schema: false
      min-pool-size: 1
      max-pool-size: 2
      connect-timeout: 5s
      acquire-timeout: 5s
      initialization-timeout: 15s
      shutdown-timeout: 5s
  cqrs:
    enabled: true
    command:
      timeout: 30s                   # Reasonable default timeout
      metrics-enabled: true          # Observability enabled
      tracing-enabled: true          # Distributed tracing active
    query:
      timeout: 15s                   # Faster timeout for read operations
      caching-enabled: true          # Performance optimization enabled
      cache-ttl: 15m
  saga.performance.enabled: true

  eda:
    enabled: true
    default-publisher-type: KAFKA
    default-connection-id: default
    publishers:
      kafka:
        default:
          enabled: true
          default-topic: domain-layer
          bootstrap-servers: localhost:9092

  stepevents:
    enabled: true

server:
  address: ${SERVER_ADDRESS:localhost}
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# Clients basePath
api-configuration:
  core-lending.loan-origination:
    base-path: ${ENDPOINT_CORE_LENDING_LOAN_ORIGINATION:http://localhost:8082}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    operationsSorter: method
    docExpansion: none
    filter: true
  packages-to-scan: io.fireflysoftware.domain.lending.loan.origination.web.controller
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    redis:
      enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    root: INFO
    io.fireflysoftware: DEBUG
    org.springframework.r2dbc: DEBUG
    org.flywaydb: DEBUG

---
spring:
  config:
    activate:
      on-profile: testing

logging:
  level:
    root: INFO
    io.fireflysoftware: DEBUG
    org.springframework.r2dbc: INFO

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: WARN
    io.fireflysoftware: INFO
    org.springframework: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
